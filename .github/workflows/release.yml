   name: Release
   on:
     push:
       tags: ["v*"]
   permissions:
     contents: write
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Zip extension
           run: zip -r mirage-tabs-${{ github.ref_name }}.zip . -x ".git/*" ".github/*" "*.md" "LICENSE"
         - name: Create release
           uses: softprops/action-gh-release@v2
           with:
             files: mirage-tabs-${{ github.ref_name }}.zip
